name: Webflow CMS CLI

on:
  workflow_dispatch:
    inputs:
      action:
        description: CLI command
        required: true
        type: choice
        options:
          - locales
          - collections
          - items
          - status
          - delete

      site:
        description: "Webflow site name substring or ID"
        required: true
        default: 66aa8fe9dc4db68f448a978f
        type: string

      collection:
        description: Collection name substring or ID
        required: false
        type: string

      items:
        description: Comma-separated item names substrings or IDs
        required: false
        type: string

      locale_mode:
        description: "For delete: keep these locales or delete them explicitly"
        required: false
        type: choice
        default: none
        options:
          - none
          - keep
          - delete-explicitly

      locale_tags:
        description: "For delete: comma-separated locale tags"
        required: false
        type: string

      live:
        description: "For delete: after preview and approval, perform the deletion"
        required: false
        type: boolean
        default: false

      json:
        description: "Use machine-readable output"
        required: false
        type: boolean
        default: false

      confirmation:
        description: "For a live deletion, type DELETE"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      COLLECTION: ${{ inputs.collection }}
      ITEMS: ${{ inputs.items }}
      LOCALE_MODE: ${{ inputs.locale_mode }}
      LOCALE_TAGS: ${{ inputs.locale_tags }}
      LIVE: ${{ inputs.live }}
      JSON_OUTPUT: ${{ inputs.json }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate
        run: |
          if [[ "$ACTION" != "delete" ]]; then
            if [[ "$LOCALE_MODE" != "none" || -n "$LOCALE_TAGS" || "$LIVE" == "true" || -n "$CONFIRMATION" ]]; then
              echo "::error::locale_mode, locale_tags, live and confirmation are only valid for delete."
              exit 2
            fi
          fi

          if [[ "$LIVE" != "true" && -n "$CONFIRMATION" ]]; then
            echo "::error::Confirmation is set but live is unchecked. Tick live for a real deletion, or clear confirmation for a dry-run."
            exit 2
          fi

          case "$ACTION" in
            items)
              if [[ -z "$COLLECTION" ]]; then
                echo "::error::Collection is required for items."
                exit 2
              fi
              ;;

            status)
              if [[ -z "$COLLECTION" || -z "$ITEMS" ]]; then
                echo "::error::Collection and items are required for status."
                exit 2
              fi
              ;;

            delete)
              if [[ -z "$COLLECTION" || -z "$ITEMS" || "$LOCALE_MODE" == "none" || -z "$LOCALE_TAGS" ]]; then
                echo "::error::Collection, items, locale mode and locale tags are required."
                exit 2
              fi

              if [[ "$JSON_OUTPUT" == "true" ]]; then
                echo "::error::JSON output is not supported for delete."
                exit 2
              fi

              if [[ "$LIVE" == "true" && "$CONFIRMATION" != "DELETE" ]]; then
                echo "::error::Type DELETE in the confirmation input."
                exit 2
              fi
              ;;
          esac

  read_command:
    name: Run ${{ inputs.action }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.action != 'delete' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run command
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          ACTION: ${{ inputs.action }}
          SITE: ${{ inputs.site }}
          COLLECTION: ${{ inputs.collection }}
          ITEMS: ${{ inputs.items }}
          JSON_OUTPUT: ${{ inputs.json }}
        run: |
          cmd=(
            node webflow-cms.js
            "$ACTION"
            --site "$SITE"
          )

          case "$ACTION" in
            items)
              cmd+=(--collection "$COLLECTION")

              if [[ -n "$ITEMS" ]]; then
                cmd+=(--items "$ITEMS")
              fi
              ;;
            
            status)
              cmd+=(--collection "$COLLECTION" --items "$ITEMS")
              ;;
          esac

          if [[ "$JSON_OUTPUT" == "true" ]]; then
            cmd+=(--json)
          fi

          printf 'Running:'
          printf ' %q' "${cmd[@]}"
          printf '\n'

          "${cmd[@]}"

  delete_preview:
    name: Preview Deletion
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.action == 'delete' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate dry-run plan
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          SITE: ${{ inputs.site }}
          COLLECTION: ${{ inputs.collection }}
          ITEMS: ${{ inputs.items }}
          LOCALE_MODE: ${{ inputs.locale_mode }}
          LOCALE_TAGS: ${{ inputs.locale_tags }}
        run: |
          set -o pipefail

          cmd=(
            node webflow-cms.js
            delete
            --site "$SITE"
            --collection "$COLLECTION"
            --items "$ITEMS"
          )

          if [[ "$LOCALE_MODE" == "keep" ]]; then
            cmd+=(--keep "$LOCALE_TAGS")
          else
            cmd+=(--locales "$LOCALE_TAGS")
          fi

          printf 'Dry-run command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'

          "${cmd[@]}" | tee dry-run-plan.txt
      
      - name: Upload dry-run plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webflow-cms-dry-run-plan-${{ github.run_id }}
          path: dry-run-plan.txt
          retention-days: 30

  live_delete:
    name: Live Deletion
    needs: delete_preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: webflow-cms-production
    concurrency:
      group: webflow-cms-cli-live-delete
      cancel-in-progress: false
      queue: max
    if: ${{ inputs.action == 'delete' && inputs.live }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Perform live deletion
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          SITE: ${{ inputs.site }}
          COLLECTION: ${{ inputs.collection }}
          ITEMS: ${{ inputs.items }}
          LOCALE_MODE: ${{ inputs.locale_mode }}
          LOCALE_TAGS: ${{ inputs.locale_tags }}
        run: |
          cmd=(
            node webflow-cms.js
            delete
            --site "$SITE"
            --collection "$COLLECTION"
            --items "$ITEMS"
          )

          if [[ "$LOCALE_MODE" == "keep" ]]; then
            cmd+=(--keep "$LOCALE_TAGS")
          else
            cmd+=(--locales "$LOCALE_TAGS")
          fi

          cmd+=(--live --yes)

          printf 'Running live command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'

          "${cmd[@]}"

      - name: Verify resulting locale status
        if: ${{ !cancelled() }}
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          SITE: ${{ inputs.site }}
          COLLECTION: ${{ inputs.collection }}
          ITEMS: ${{ inputs.items }}
        run: |
          node webflow-cms.js status \
            --site "$SITE" \
            --collection "$COLLECTION" \
            --items "$ITEMS"

      - name: Upload backups and audit logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webflow-cms-backup-${{ github.run_id }}
          path: |
            backups/
            logs/
          if-no-files-found: ignore
          retention-days: 90
